<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理后台 · Zili Nutrition</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .login-panel {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .login-panel.is-hidden { opacity: 0; pointer-events: none; }
    .login-card {
      background: #fff;
      border: 1px solid #e3e4e6;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 32px 36px;
      text-align: center;
      max-width: 340px;
    }
    .login-card h1 { font-size: 20px; margin: 0 0 6px; color: #1f2933; }
    .login-card p { font-size: 13px; color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
    #netlify-login-btn {
      background: #0f766e;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: 14px;
      cursor: pointer;
    }
    #netlify-login-btn:hover { background: #115e59; }
  </style>
</head>
<body>
  <div class="login-panel" id="login-panel">
    <div class="login-card">
      <h1>Zili Nutrition 内容管理</h1>
      <p>使用 Netlify Identity 登录后即可在可视化后台编辑站点内容。</p>
      <button id="netlify-login-btn">使用 Netlify 登录</button>
    </div>
  </div>

  <!-- Netlify Identity：GitHub backend 的官方认证入口 -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap CMS 前端（本地 vendor，避免依赖 unpkg 加载） -->
  <script src="./decap-cms.js"></script>
  <script>
    // 显式配置 Netlify Identity 站点（自定义域名托管在 GitHub Pages 时必需）
    if (window.netlifyIdentity) {
      // 必须先注册 init 回调，再调用 init()
      window.netlifyIdentity.on("init", function (user) {
        window.netlifyIdentity.init({
          APIUrl: 'https://aesthetic-marzipan-71d83e.netlify.app/.netlify/identity'
        });
        var btn = document.getElementById("netlify-login-btn");
        if (user) {
          document.getElementById("login-panel").classList.add("is-hidden");
          return;
        }
        window.netlifyIdentity.on("login", function () {
          document.getElementById("login-panel").classList.add("is-hidden");
        });
        window.netlifyIdentity.on("logout", function () {
          document.getElementById("login-panel").classList.remove("is-hidden");
        });
        btn.addEventListener("click", function () {
          window.netlifyIdentity.open();
        });
      });
    } else {
      // Identity 脚本未加载时保留入口，避免白屏
      document.getElementById("login-panel").classList.add("is-hidden");
    }
  </script>
</body>
</html>
