# Decap CMS 配置文件 — Zili Nutrition 外贸独立站
# 认证链路：Netlify 标准路径。正式启用前需：
#   1. 注册免费 Netlify 账号（app.netlify.com）
#   2. 任意新建一个 Site（或直接对接本仓库），启用 GitHub OAuth
#   3. 保存 Site 后，把以下两项填入 backend：
#        base_url: https://api.netlify.com
#        auth_endpoint: auth
#     并在 admin/index.html 保留 netlify-identity-widget.js 引用

backend:
  name: github
  repo: zilinutrition-arch/zili-nutrition-site
  branch: main
# Netlify 隐式 OAuth
  base_url: https://api.netlify.com
  auth_endpoint: auth

local_backend: false

# 后台图片上传会提交到仓库 media/ 目录
media_folder: 'media'
public_folder: '/media'

site_url: https://zvitahealth.com

