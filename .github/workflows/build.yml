name: Build site from content

"on":
  push:
    branches: [main]
    # 只在内容源变更时触发；构建产物 index.html 的提交回 main 不在此列，天然防循环
    paths:
      - "content/**"
      - "templates/**"
      - "tools/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate admin config.yml
        run: ruby -ryaml -e 'YAML.load_file("admin/config.yml"); puts "config.yml OK"'

      - name: Rebuild index.html from templates + content
        run: python3 tools/build.py

      - name: Commit rebuilt index.html back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: rebuild index.html from content"
            git push origin main
          else
            echo "index.html unchanged, nothing to commit"
          fi